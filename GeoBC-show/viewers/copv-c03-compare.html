<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/access.css"><script src="../assets/access.js"></script><title>C03 · 网格与阶次同步对照</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:12px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:#f4f8fa;color:#294b5c;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:white;border-bottom:1px solid #d0dfe7;flex-wrap:wrap}a{color:#286882}select{font:inherit;padding:5px 8px;border:1px solid #c5d5df;border-radius:5px;color:#315567;background:white}.stage{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}.pane{display:flex;flex-direction:column;min-width:0}.pane+ .pane{border-left:1px solid #c9dbe5}.pane label{padding:5px 12px;background:#ebf2f6}.pane select{max-width:85%}iframe{flex:1;border:0;width:100%;min-height:0}.note{font-size:11px;color:#6e8190;padding:5px 12px;border-top:1px solid #d9e4ea;background:white}.scope{color:#986026;font-size:11px}@media(max-width:600px){.toolbar{gap:5px}.pane label{padding:5px}.pane select{max-width:100%;font-size:10px}}
</style></head><body><div class="toolbar"><a href="../C03.html">← C03</a><label>对照 <select id="preset"><option value="order6">相同 h6：P1 / P2</option><option value="p2mesh">P2：h6 / h4</option><option value="p1mesh">P1：h6 / h4</option><option value="closure">h6 P1：圆形 / 离散孔口闭合</option><option value="custom">自选</option></select></label><span>旋转、缩放、场量、变形、状态与 BC/载荷开关同步</span><span class="scope">研究对照 · 生产网格门槛尚未通过</span></div><main class="stage"><section class="pane"><label>左 <select id="left-case" aria-label="左侧算例"></select></label><iframe id="left" title="左侧 C03 有限元场与三维边界载荷"></iframe></section><section class="pane"><label>右 <select id="right-case" aria-label="右侧算例"></select></label><iframe id="right" title="右侧 C03 有限元场与三维边界载荷"></iframe></section></main><footer class="note">所有算例使用同一峰值色标；位置和方向来自实际网格、约束和载荷。箭头是三维圆柱/锥体，长度示意。P2 节点自由度独立；跨网格差异不等于真实离散误差。</footer><script>
'use strict';let latest=null,cases=[];const left=document.getElementById('left'),right=document.getElementById('right'),A=document.getElementById('left-case'),B=document.getElementById('right-case');
const presets={order6:['h6_P1','h6_P2'],p2mesh:['h6_P2','h4_P2'],p1mesh:['h6_P1','h4_P1'],closure:['h6_P1','h6_P1_discrete']};
function load(frame,id){frame.src='copv-c03-case.html?case='+encodeURIComponent(id)+'&bc=1&loads=1&v=c03-1'}
function pick(a,b){A.value=a;B.value=b;load(left,a);load(right,b)}
document.getElementById('preset').onchange=e=>{const p=presets[e.target.value];if(p)pick(...p)};
for(const [select,frame]of [[A,left],[B,right]])select.onchange=()=>{document.getElementById('preset').value='custom';load(frame,select.value)};
window.addEventListener('message',e=>{if(e.origin!==location.origin||![left.contentWindow,right.contentWindow].includes(e.source))return;if(e.data?.kind==='c03-sync'){latest=e.data.state;const target=e.source===left.contentWindow?right:left;target.contentWindow.postMessage({kind:'c03-apply',state:latest},location.origin)}else if(e.data?.kind==='c03-ready'&&latest)e.source.postMessage({kind:'c03-apply',state:latest},location.origin)});
fetch('../data/copv-c03-cases.json').then(r=>r.json()).then(d=>{cases=d.cases;for(const select of [A,B])select.innerHTML=cases.map(x=>'<option value="'+x.id+'">'+x.id+' · P'+x.degree+' · h='+x.h_mm+' mm · '+(x.cap_convention==='discrete'?'离散孔口':'圆形端力')+'</option>').join('');const q=new URLSearchParams(location.search),preset=q.get('comparison')||'order6';document.getElementById('preset').value=preset;pick(...(presets[preset]||presets.order6))}).catch(e=>document.querySelector('.scope').textContent='加载失败：'+String(e));
</script></body></html>
