<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COPV · 均匀内压场查看</title><link rel="stylesheet" href="../assets/access.css"><script src="../assets/access.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:12px/1.5 system-ui,'Microsoft YaHei',sans-serif;color:#233e55;background:#f5f7fa;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:7px;padding:9px 12px;background:#fff;border-bottom:1px solid #dae1e9}label{display:flex;align-items:center;gap:4px}button,select{font:inherit;border:1px solid #bac9d8;background:white;color:#294665;border-radius:5px;padding:5px 8px;cursor:pointer}button[aria-pressed=true]{background:#3c5488;color:#fff}main{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}#labels{position:absolute;left:15px;right:15px;top:12px;display:flex;pointer-events:none}#labels span{width:50%;font-weight:600}.legend{position:absolute;right:12px;bottom:13px;background:#fffffff0;padding:9px 12px;border-radius:5px;width:180px;pointer-events:none}.bar{height:9px;background:linear-gradient(90deg,#3c5488,#f7f7f7,#e64b35);margin:5px 0}.ticks{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}#note{margin:0;padding:6px 12px;border-top:1px solid #dbe3ea;color:#607286;background:white;font-size:10px}#note span{display:block}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffffff2;border:1px solid #c5d3df;padding:12px 18px;border-radius:6px;max-width:90%}#status:empty{display:none}.split{position:absolute;left:50%;height:100%;width:1px;background:#c8d6e0;pointer-events:none}#help{position:absolute;bottom:15px;left:12px;font-size:10px;color:#687b8d;max-width:50%;pointer-events:none;background:#ffffffb8;padding:4px 6px}button:disabled{opacity:.5}button:focus-visible,select:focus-visible{outline:3px solid #e64b35}#labels span:last-child{display:none}body.comparing #labels span:last-child{display:block}@media(max-width:600px){header{padding:6px;gap:5px;font-size:11px}button,select{padding:4px 5px}#labels{font-size:11px;left:8px}.legend{width:145px;font-size:10px;bottom:48px;right:7px}#help{bottom:5px;max-width:95%;font-size:9px}#note{font-size:9px;padding:5px 7px}}
</style></head><body><header aria-label="场查看控制"><label>内压<select id="case" aria-label="选择内压"></select></label><label>对比<select id="compare" aria-label="对比内压"><option value="">关闭</option></select></label><select id="field" aria-label="场量"><option value="U">位移 |U| [mm]</option><option value="VM">单元平均 VM [MPa]</option></select><label>变形<select id="deform" aria-label="变形倍率"><option value="0">原形 ×0</option><option value="1" selected>×1</option><option value="5">×5</option></select></label><button id="loads" aria-pressed="true">载荷</button><button id="cut" aria-pressed="false">剖面</button><button id="mesh" aria-pressed="false">网格</button><button id="reset">复位</button></header><main><canvas id="model" aria-label="实际轴对称有限元场旋转三维显示"></canvas><div id="labels"><span></span><span></span></div><div class="split" hidden></div><div class="legend"><div id="quantity">位移 |U| [mm] · 统一色标</div><div class="bar"></div><div class="ticks"><span>0</span><span id="maximum"></span></div></div><div id="help">拖动旋转 · 滚轮／双指缩放 · Shift拖动平移 · 双击复位<br>橙色实体箭头：实际内压与封闭端合力，长度示意；箭头透视显示。</div><div id="status" role="status" aria-live="polite">正在校验并载入真实场…</div></main><p id="note"><span>轴对称 Q2 场绕轴显示；周向细分仅为显示。变形倍率见上方；位移使用原节点，剖面用原 Quad9 节点拆片显示。</span><span>应力颜色为原单元 9 个积分点的体积加权 VM 均值，不跨单元平滑；VM 不是正交各向异性强度准则。</span><span>均匀等效壁线弹性幅值基准；高压段属数学外推，未作额定承压／大变形验证。</span></p><script src="../assets/fe-glyphs-3d.js"></script><script src="../assets/copv-pressure20-v1/viewer.js"></script></body></html>
