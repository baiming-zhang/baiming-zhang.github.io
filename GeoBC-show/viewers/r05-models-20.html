    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#f6f9fa;color:#173247;font:13px/1.45 system-ui,"Microsoft YaHei",sans-serif}body{display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;background:#fff;border-bottom:1px solid #dbe4e8}.case-list{display:flex;gap:5px;flex-wrap:wrap}.case-list button,select,.toolbar>button{font:inherit;border:1px solid #c7d5dc;border-radius:5px;background:#fff;color:#315468;padding:6px 9px;cursor:pointer}.case-list button[aria-pressed="true"]{background:#dfeee8;border-color:#72a693;color:#195b46}.toolbar label{display:flex;align-items:center;gap:5px;white-space:nowrap}.stage{position:relative;flex:1;min-height:0;background:#f9fbfc}.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.stage canvas:active{cursor:grabbing}.labels{position:absolute;inset:0;display:grid;pointer-events:none}.panel-label{padding:12px 14px;border-right:1px solid #dbe4e8;border-bottom:1px solid #dbe4e8}.panel-label b{font-size:15px}.panel-label span{display:block;width:max-content;max-width:95%;margin-top:4px;padding:3px 7px;border-radius:999px;background:#e3f2eb;color:#176044;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-label span.fail{background:#fce6e0;color:#8f3022}.message{position:absolute;inset:18px auto auto 50%;transform:translateX(-50%);padding:8px 12px;background:#fff8db;border:1px solid #e6d08b;border-radius:6px;color:#735310;z-index:2}.foot{display:flex;align-items:center;gap:14px;padding:6px 12px;background:#fff;border-top:1px solid #dbe4e8;color:#607985;min-height:36px}.gradient{width:150px;height:10px;border-radius:99px;background:linear-gradient(90deg,#440154,#31688e,#35b779,#fde725)}.gradient.stress{background:linear-gradient(90deg,#30123b,#4043a6,#4670e8,#3e9bfe,#21c4e1,#1ae4b6,#46f783,#87fe4d,#b9f534,#e1dc37,#f9ba38,#fd8c27,#ef5a11,#d63405,#ae1801,#7a0402)}.gradient.errorgrad{background:linear-gradi <body>
  <div class="toolbar">

    <a href="../R05.html" target="_top">R05</a> · <a href="../assets/r05-models20-20261026/R05_20_surface_models.zip">下载20个表面模型</a><label>工况 <select id="scenario"></select></label>

<script>
const canvas=document.getElementById('canvas'),gl=canvas.getContext('webgl2',{antialias:true,alpha:false});
let manifest,program,selected=new Set(["normal_rodv2_0170__gas_inertia_30deg", "normal_rodv2_0191__tension_skew", "normal_rodv2_0103__compression_skew"]),scenario='full_load',mode='stress',wire=false,pan=[0,0],zoom=1,az=.2,el=.72,drag=null,active=[],requestId=0;
const bcInitialParams=new URLSearchParams(location.search);if(bcInitialParams.get('case'))selected=new Set([bcInitialParams.get('case')]);if(bcInitialParams.get('scenario'))scenario=bcInitialParams.get('scenario');
const geometryCache=new Map(),fieldCache=new Map();
const failureLabels={petsc_cuda_nonconvergence:'CUDA迭代未收敛',yield_scope_guard:'越出当前弹性本构范围'};
function showError(e){const box=document.getElementById('error');box.hidden=false;box.textContent=String(e)}
function note(text){const box=document.getElementById('message');box.textContent=text;box.hidden=!text;if(text)setTimeout(()=>{if(box.textContent===text)box.hidden=true},2600)}
function decode(text,Type){const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));return new Type(bytes.buffer)}
async function loadGzipJson(url){const response=await fetch(url);if(!response.ok)throw Error('资源加载失败：'+url);if(!('DecompressionStream'in window))throw Error('当前浏览器不支持gzip流解压，请使用新版Chrome或Edge。');return new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json()}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function uniform(name,value){const location=gl.getUniformLocation(program,name);if(Array.isArray(value)){if(value.length===3)gl.uniform3fv(location,value);else gl.uniform2fv(location,value)}else if(['uMode','uHasField','uWire'].includes(name))gl.uniform1i(location,value);else gl.uniform1f(location,value)}
function makeBuffer(target,data){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,gl.STATIC_DRAW);return b}
function initGL(){if(!gl)throw Error('当前浏览器未启用WebGL2。');program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
in vec3 aPosition;in vec3 aU;in vec2 aScalar;uniform vec3 uCenter,uRight,uUp,uDepth;uniform vec2 uPan;uniform float uScale,uAspect,uRadius,uDeform,uMax,uError;uniform int uMode;uniform bool uHasField;out float value;out vec3 world;void main(){vec3 x=aPosition+(uHasField?aU*uDeform:vec3(0));vec3 a=x-uCenter;vec3 p=vec3(dot(a,uRight),dot(a,uUp),dot(a,uDepth));world=a;gl_Position=vec4(p.x/(uScale*uAspect)+uPan.x,p.y/uScale+uPan.y,-p.z/(uRadius*4.0),1);value=uHasField?(uMode==0?aScalar.x/uMax:uMode==1?aScalar.y/uMax:uError):0.;}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;precision highp int;in float value;in vec3 world;uniform int uMode;uniform bool uHasField,uWire;out vec4 color;vec3 viridis(float t){return clamp(vec3(.27+.72*t-.25*t*t,.02+1.25*t-.32*t*t,.34+1.28*t-1.42*t*t),0.,1.);}vec3 inferno(float t){return clamp(vec3(.04+1.55*t-.58*t*t,.01+.36*t+.62*t*t,.09+.75*t-1.02*t*t),0.,1.);}vec3 turbo(float t){vec3 c[16]=vec3[16](vec3(0.1899500,0.0717600,0.2321700),vec3(0.2536900,0.2632700,0.6540600),vec3(0.2769100,0.4414500,0.9132800),vec3(0.2442700,0.6093700,0.9969700),vec3(0.1327800,0.7716500,0.8858000),vec3(0.1034200,0.8960000,0.7150000),vec3(0.2759700,0.9709200,0.5165300),vec3(0.5325500,0.9991900,0.3058100),vec3(0.7259600,0.9647000,0.2064000),vec3(0.8833100,0.8655300,0.2171900),vec3(0.9800000,0.7300000,0.2216100),vec3(0.9929700,0.5521400,0.1541700),vec3(0.9408400,0.3556600,0.0703100),vec3(0.8392600,0.2065400,0.0230500),vec3(0.6860200,0.0953600,0.0048100),vec3(0.4796000,0.0158300,0.0105500));float p=clamp(t,0.,1.)*15.;int i=min(int(p),14);return mix(c[i],c[i+1],p-float(i));}void main(){if(uWire){color=vec4(.035,.055,.07,.42);return;}vec3 n=normalize(cross(dFdx(world),dFdy(world)));float shade=.68+.28*abs(dot(n,normalize(vec3(-.3,-.45,.84))));vec3 base=!uHasField?(uMode==2?vec3(.72,.18,.12):vec3(.73,.76,.77)):(uMode==0?viridis(pow(clamp(value,0.,1.),.55)):uMode==1?turbo(clamp(value,0.,1.)):mix(vec3(.12,.66,.40),vec3(.94,.58,.12),clamp(value,0.,1.)));color=vec4(base*shade,1.);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL)}
async function geometryFor(item){if(geometryCache.has(item.id))return geometryCache.get(item.id);const data=await loadGzipJson(item.mesh),xyz=decode(data.xyz,Float32Array),tri=decode(data.tri,Uint32Array);let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let i=0;i<xyz.length;i++){const k=i%3;lo[k]=Math.min(lo[k],xyz[i]);hi[k]=Math.max(hi[k],xyz[i])}const g={id:item.id,xyz,tri,center:lo.map((x,k)=>(x+hi[k])/2),radius:Math.hypot(...lo.map((x,k)=>hi[k]-x))/2,pos:makeBuffer(gl.ARRAY_BUFFER,xyz),faces:makeBuffer(gl.ELEMENT_ARRAY_BUFFER,tri),count:tri.length,edges:null,edgeCount:0};geometryCache.set(item.id,g);return g}
async function fieldFor(sample,count){if(!sample.asset)return null;if(fieldCache.has(sample.asset))return fieldCache.get(sample.asset);const data=await loadGzipJson(sample.asset),uq=decode(data.u_q,Int16Array),vmq=decode(data.vm_q,Uint16Array);if(uq.length!==count*3||vmq.length!==count)throw Error('场数据与表面节点数量不一致');const u=new Float32Array(uq.length),scalar=new Float32Array(count*2);for(let i=0;i<uq.length;i++)u[i]=uq[i]*data.u_scale;for(let i=0;i<count;i++){const x=u[3*i],y=u[3*i+1],z=u[3*i+2];scalar[2*i]=Math.hypot(x,y,z);scalar[2*i+1]=vmq[i]*data.vm_scale}const f={u:makeBuffer(gl.ARRAY_BUFFER,u),scalar:makeBuffer(gl.ARRAY_BUFFER,scalar)};fieldCache.set(sample.asset,f);return f}
function ensureEdges(g){if(g.edges)return;const lines=new Uint32Array(g.tri.length*2);for(let i=0,j=0;i<g.tri.length;i+=3){lines[j++]=g.tri[i];lines[j++]=g.tri[i+1];lines[j++]=g.tri[i+1];lines[j++]=g.tri[i+2];lines[j++]=g.tri[i+2];lines[j++]=g.tri[i]}g.edges=makeBuffer(gl.ELEMENT_ARRAY_BUFFER,lines);g.edgeCount=lines.length}
function grid(n){const cols=n<=3?n:2;return{cols,rows:Math.ceil(n/cols)}}
function labelFor(entry){const s=entry.sample;return `<b>${String(s.number).padStart(2,'0')} ${s.label}</b><span>${s.backend.toUpperCase()} · GP峰值 ${s.max_VM_MPa.toFixed(1)} MPa · U ${s.max_U_mm.toFixed(3)} mm</span><span>PEEQ ${s.max_PEEQ.toPrecision(3)} · 原100%满载</span>`}
async function refresh(){const ticket=++requestId,ids=[...selected],samples=new Map(manifest.samples.map(x=>[x.case_id+'__'+x.scenario,x]));const entries=await Promise.all(ids.map(async caseId=>{const item=manifest.cases.find(x=>x.id===caseId),sample=samples.get(caseId+'__'+scenario),geom=await geometryFor(item),field=sample.asset?await fieldFor(sample,geom.xyz.length/3):null;return{caseId,sample,geom,field}}));if(ticket!==requestId)return;active=entries;const g=grid(active.length),labels=document.getElementById('labels');labels.style.gridTemplateColumns=`repeat(${g.cols},1fr)`;labels.style.gridTemplateRows=`repeat(${g.rows},1fr)`;labels.innerHTML=active.map(x=>`<div class="panel-label">${labelFor(x)}</div>`).join('');draw()}
function bindAttribute(name,buffer,size){const a=gl.getAttribLocation(program,name);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,size,gl.FLOAT,false,0,0)}
function disableAttribute(name,size){const a=gl.getAttribLocation(program,name);gl.disableVertexAttribArray(a);if(size===3)gl.vertexAttrib3f(a,0,0,0);else gl.vertexAttrib2f(a,0,0)}
function draw(){if(!program||!active.length)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);gl.clearColor(.975,.985,.99,1);gl.disable(gl.SCISSOR_TEST);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.SCISSOR_TEST);const layout=grid(active.length),cw=Math.floor(canvas.width/layout.cols),ch=Math.floor(canvas.height/layout.rows),ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el),globalRadius=Math.max(...active.map(x=>x.geom.radius)),accepted=active.filter(x=>x.field),maxU=Math.max(1e-12,...accepted.map(x=>x.sample.max_U_mm||0)),maxVM=1000,deform=1,residuals=accepted.map(x=>x.sample.residual).filter(Number.isFinite),logs=residuals.length?residuals.map(Math.log10):[0],minLog=Math.min(...logs),maxLog=Math.max(...logs);uniform('uRight',[ca,sa,0]);uniform('uUp',[-sa*se,ca*se,ce]);uniform('uDepth',[sa*ce,-ca*ce,se]);uniform('uScale',globalRadius*Math.max(1.2,1.2/(cw/ch))/zoom);uniform('uRadius',globalRadius);uniform('uAspect',cw/ch);uniform('uPan',pan);uniform('uMode',mode==='U'?0:mode==='stress'?1:2);uniform('uDeform',deform);uniform('uMax',mode==='stress'?maxVM:maxU);document.getElementById('legend-high').textContent=mode==='stress'?'1000 MPa':maxU.toFixed(3)+' mm';for(let i=0;i<active.length;i++){const x=active[i],row=Math.floor(i/layout.cols),col=i%layout.cols,y=canvas.height-(row+1)*ch;gl.viewport(col*cw,y,cw,ch);gl.scissor(col*cw,y,cw,ch);uniform('uCenter',x.geom.center);uniform('uHasField',x.field?1:0);const lr=x.field&&Number.isFinite(x.sample.residual)?Math.log10(x.sample.residual):minLog;uniform('uError',maxLog>minLog?.15+.7*(lr-minLog)/(maxLog-minLog):.35);bindAttribute('aPosition',x.geom.pos,3);if(x.field){bindAttribute('aU',x.field.u,3);bindAttribute('aScalar',x.field.scalar,2)}else{disableAttribute('aU',3);disableAttribute('aScalar',2)}uniform('uWire',0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,x.geom.faces);gl.drawElements(gl.TRIANGLES,x.geom.count,gl.UNSIGNED_INT,0);if(wire){ensureEdges(x.geom);uniform('uWire',1);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,x.geom.edges);gl.drawElements(gl.LINES,x.geom.edgeCount,gl.UNSIGNED_INT,0);gl.disable(gl.BLEND)}}const grad=document.getElementById('gradient'),noResidual=mode==='error'&&!accepted.length;grad.hidden=noResidual;document.getElementById('legend-high').hidden=noResidual;grad.className='gradient'+(mode==='stress'?' stress':mode==='error'?' errorgrad':'');document.getElementById('legend-label').textContent=mode==='error'?(noResidual?'Error：红色表示未接受，原因见标签':'Error：残差低'):'统一色阶：低'}
function reset(){pan=[0,0];zoom=1;az=.2;el=.72;draw()}
function populate(){document.getElementById('case-list').innerHTML=manifest.cases.map(c=>`<button type="button" data-case="${c.id}" aria-pressed="${selected.has(c.id)}">${String(c.number).padStart(2,'0')} ${c.label}</button>`).join('');document.getElementById('scenario').innerHTML=manifest.scenarios.map(s=>`<option value="${s.id}" ${s.id===scenario?'selected':''}>${s.label}</option>`).join('');document.querySelectorAll('[data-case]').forEach(button=>button.onclick=()=>{const id=button.dataset.case;if(selected.has(id)){if(selected.size===1){note('至少保留一个 case');return}selected.delete(id)}else{if(selected.size===4){note('为保持可读性，最多同时比较四个 case');return}selected.add(id)}document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',selected.has(b.dataset.case)));refresh().catch(showError)})}
canvas.addEventListener('wheel',e=>{e.preventDefault();const next=Math.min(25,Math.max(.3,zoom*Math.exp(-e.deltaY*.0015))),rect=canvas.getBoundingClientRect(),layout=grid(active.length),pw=rect.width/layout.cols,ph=rect.height/layout.rows,x=2*((e.clientX-rect.left)%pw)/pw-1,y=1-2*((e.clientY-rect.top)%ph)/ph,ratio=next/zoom;pan=[x-(x-pan[0])*ratio,y-(y-pan[1])*ratio];zoom=next;draw()},{passive:false});canvas.addEventListener('pointerdown',e=>{if(e.button===1)e.preventDefault();drag=[e.clientX,e.clientY,e.button===1];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1],middle=drag[2];drag=[e.clientX,e.clientY,middle];if(middle||e.shiftKey){pan[0]+=2*dx/canvas.clientWidth;pan[1]-=2*dy/canvas.clientHeight}else{az+=dx*.006;el=Math.min(1.55,Math.max(-1.55,el+dy*.006))}draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});canvas.addEventListener('dblclick',reset);document.getElementById('scenario').onchange=e=>{scenario=e.target.value;refresh().catch(showError)};document.getElementById('field').onchange=e=>{mode=e.target.value;draw()};document.getElementById('wire').onchange=e=>{wire=e.target.checked;draw()};document.getElementById('reset').onclick=reset;new ResizeObserver(()=>draw()).observe(canvas);
(async()=>{try{initGL();manifest=await fetch('../assets/r05-models20-20261026/manifest.json').then(r=>{if(!r.ok)throw Error('清单加载失败');return r.json()});populate();await refresh()}catch(e){showError(e)}})();
</script>
