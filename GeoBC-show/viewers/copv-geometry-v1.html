<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COPV 参数化几何</title><link rel="stylesheet" href="../assets/access.css"><script src="../assets/access.js"></script><style>
*{box-sizing:border-box}body{margin:0;color:#233b49;background:#f7fafb;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{min-height:58px;padding:10px 15px;display:flex;align-items:center;gap:9px;background:white;border-bottom:1px solid #dce5e9;flex-wrap:wrap}button,select{font:inherit;border:1px solid #c9d7de;border-radius:6px;background:white;padding:6px 10px;color:#264859;cursor:pointer}button.active{background:#244f56;color:#fff;border-color:#244f56}main{height:calc(100vh - 60px);min-height:350px;position:relative;overflow:hidden}canvas{height:100%;width:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.label{position:absolute;top:18px;left:20px;pointer-events:none;max-width:65%}.label b{font-size:21px}.label p{margin:5px 0;color:#607984}.legend{position:absolute;top:18px;right:20px;padding:9px 12px;background:#ffffffdf;border-radius:8px;pointer-events:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.hint{position:absolute;left:20px;bottom:17px;color:#647d89;background:#ffffffdc;border-radius:7px;padding:8px 12px;pointer-events:none;font-size:12px}#error{position:absolute;inset:20px;padding:20px;background:white;color:#963e36}#error:empty{display:none}@media(max-width:700px){header{gap:5px;padding:7px}select{max-width:150px}.label b{font-size:17px}.label{left:12px}.legend{right:12px;font-size:12px}.hint{left:12px;right:12px;font-size:11px}main{height:calc(100vh - 100px)}}
