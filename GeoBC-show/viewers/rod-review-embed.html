<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原节点场 · 三维审阅</title><link rel="stylesheet" href="../assets/access.css"><script src="../assets/access.js"></script><link rel="stylesheet" href="../assets/rod-review-embed.css"></head><body>
<div class="tools"><div class="identity"><span class="dot"></span><b id="identity">原节点三维场</b></div><div class="choices" id="counts" aria-label="训练数据量"><button data-count="1">1条</button><button data-count="5">5条</button><button data-count="20" class="on">20条</button></div><select id="sample" aria-label="选择展示工况"></select><div class="choices" id="fields"><button data-field="U">位移</button><button data-field="VM" class="on">应力</button></div><label class="mesh"><input type="checkbox" id="mesh">网格</label><button class="reset" id="reset" aria-label="复位视角">复位 ↺</button></div>
<div class="mobile-panes" id="mobile-panes"><button data-pane="0" class="on">真值</button><button data-pane="1">预测</button><button data-pane="2">误差</button></div>
<div class="scene"><div id="panels" class="panels"></div><canvas id="scene" aria-label="可旋转的真实原节点模型和场对比"></canvas><div class="loading" id="loading">正在载入原节点模型…</div><div class="hint">拖动旋转 · 滚轮缩放 · Shift 拖动平移</div></div>
<div class="caption" id="caption">原二次表面 · 变形 ×1 · 节点VM为原GP场的投影</div>
<script src="../assets/rod-review-embed.js"></script></body></html>
