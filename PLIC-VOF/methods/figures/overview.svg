<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#337c77"/></marker></defs><rect width="960" height="310" fill="#f6f9f8"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#203d43;font-size:19px}.small{font-size:16px;fill:#52696e}.arr{stroke:#337c77;stroke-width:2;fill:none;marker-end:url(#a)}.box{fill:white;stroke:#85ada7;stroke-width:1.5}</style><rect class="box" x="30" y="30" width="260" height="80" rx="8"/><text x="46" y="60">① 原始体积分数 f</text><text class="small" x="46" y="87">记录各单元液体占比</text><rect class="box" x="350" y="30" width="260" height="80" rx="8"/><text x="366" y="60">② 局部网络</text><text class="small" x="366" y="87">3×3 模板 → 共享特征</text><rect class="box" x="670" y="30" width="260" height="80" rx="8"/><text x="686" y="60">③ 两个几何输出</text><text class="small" x="686" y="87">受限通量 F 与曲率 κh</text><rect class="box" x="670" y="185" width="260" height="80" rx="8"/><text x="686" y="215">④ 宿主物理推进</text><text class="small" x="686" y="242">输运、力和黏性</text><rect class="box" x="350" y="185" width="260" height="80" rx="8"/><text x="366" y="215">⑤ 压力投影</text><text class="small" x="366" y="242">CPU：AMGCL / compact</text><rect class="box" x="30" y="185" width="260" height="80" rx="8"/><text x="46" y="215">⑥ 新的速度与 f</text><text class="small" x="46" y="242">子步输运后刷新曲率</text><path class="arr" d="M290 70H345M610 70H665M800 110V180M670 225H615M350 225H295"/></svg>